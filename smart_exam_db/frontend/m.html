<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5fd0">
<title>Smart Exam – Chụp phiếu</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app/m.css">
</head>
<body>
<header class="top"><b>Chụp phiếu</b><span id="who" class="who"></span><button type="button" id="logout" class="link hidden">Đăng xuất</button></header>

<!-- 1. Đăng nhập -->
<section id="v-login" class="view hidden">
  <h1>Đăng nhập</h1>
  <form id="f-login">
    <label>Tên đăng nhập<input id="lg-user" autocomplete="username" autocapitalize="none" required></label>
    <label>Mật khẩu<input id="lg-pass" type="password" autocomplete="current-password" required></label>
    <div id="lg-err" class="msg bad hidden"></div>
    <button class="big pri" type="submit">Đăng nhập</button>
  </form>
</section>

<!-- 2. Chọn kỳ thi -->
<section id="v-exams" class="view hidden">
  <h1>Chọn kỳ thi</h1>
  <div id="exam-list" class="list"></div>
</section>

<!-- 3–5. Chụp / đang chấm / kết quả -->
<section id="v-cap" class="view hidden">
  <button type="button" id="doi-ky-thi" class="exam-head"><span id="cap-sub" class="sub"></span><b id="cap-title"></b><span class="sub">Đổi kỳ thi ›</span></button>
  <div id="ket-qua" class="card hidden"></div>
  <div id="dang-cham" class="card hidden"><div class="spin"></div><b id="dc-txt">Đang tải ảnh…</b><div class="bar"><div id="dc-bar"></div></div></div>
  <div id="counter" class="counter"></div>
  <ul id="recent" class="recent"></ul>
  <p class="hint">Đặt phiếu phẳng, đủ sáng, thấy đủ <b>4 ô vuông đen</b> ở 4 góc. Ảnh gửi nguyên bản (không nén).</p>
  <div class="dock">
    <label class="big pri cam" id="cam-btn"><span id="cam-txt">📷 Chụp phiếu</span>
      <input type="file" id="cam" accept="image/*" capture="environment"></label>
  </div>
</section>

<div id="toast" class="toast hidden"></div>
<script src="/app/m.js"></script>
</body>
</html>
